<title>همراه خرید Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&display=swap">
<style>
/* Layout: a design canvas. Each screen is a row of 375px phone artboards (scrolls sideways inside its own track);
   annotations in English for the team, phones in Persian RTL. Lapis accent; status colours are reserved for meaning. */
/* Torob family (ترب = radish): radish red + white cards on pale slate; red for actions/selection, blue for info/explanations,
   danger is a darker brick red always paired with an alert icon. Status colours keep meaning. */
:root{
  --canvas:#E2E8F0; --paper:#F1F5F9; --card:#FFFFFF; --sunk:#E9EEF5;
  --ink:#1E293B; --ink-2:#475569; --ink-3:#64748B; --line:#E2E8F0; --line-2:#CBD5E1;
  --accent:#D73948; --accent-ink:#B0283A; --accent-soft:#FDECEE; --on-accent:#FFFFFF;
  --accent-grad:linear-gradient(90deg,#C42E3F,#E04A5A);
  --brand:#D73948; --brand-soft:#FCE9EB; --on-brand:#FFFFFF; --leaf:#3F9A4A;
  --info:#2563EB; --info-ink:#1D4ED8; --info-soft:#EAF1FE;
  --ok:#15803D; --ok-soft:#E3F5E8; --warn:#A95E00; --warn-soft:#FEF1D9; --bad:#9A1B1B; --bad-soft:#FBEAE4;
  --unk:#7A8699; --unk-soft:#EEF2F6;
  --device:#0F172A; --shadow:0 1px 2px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.10);
  --map-bg:#EEF2EC; --map-road:#FFFFFF; --map-block:#E2E8DF; --map-major:#F8E7B5;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-display:"Vazirmatn",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#111720; --paper:#1A212C; --card:#232B38; --sunk:#1E2631;
  --ink:#E5E9F0; --ink-2:#AEB8C7; --ink-3:#8592A6; --line:#2E3746; --line-2:#3C4757;
  --accent:#F0606E; --accent-ink:#FF9AA4; --accent-soft:#3A1F27; --on-accent:#FFFFFF;
  --accent-grad:linear-gradient(90deg,#C42E3F,#E04A5A);
  --brand:#E5505E; --brand-soft:#3D1E24; --on-brand:#FFFFFF; --leaf:#5DBB68;
  --info:#6EA0FA; --info-ink:#A3C3FF; --info-soft:#1E2E4E;
  --ok:#4ACB85; --ok-soft:#14301F; --warn:#F1B44E; --warn-soft:#352812; --bad:#FF8F6E; --bad-soft:#3B1E16;
  --unk:#8A96A9; --unk-soft:#212A36;
  --device:#000000; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --map-bg:#1B2330; --map-road:#2E3848; --map-block:#222B38; --map-major:#4A4228;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#111720; --paper:#1A212C; --card:#232B38; --sunk:#1E2631;
  --ink:#E5E9F0; --ink-2:#AEB8C7; --ink-3:#8592A6; --line:#2E3746; --line-2:#3C4757;
  --accent:#F0606E; --accent-ink:#FF9AA4; --accent-soft:#3A1F27; --on-accent:#FFFFFF;
  --accent-grad:linear-gradient(90deg,#C42E3F,#E04A5A);
  --brand:#E5505E; --brand-soft:#3D1E24; --on-brand:#FFFFFF; --leaf:#5DBB68;
  --info:#6EA0FA; --info-ink:#A3C3FF; --info-soft:#1E2E4E;
  --ok:#4ACB85; --ok-soft:#14301F; --warn:#F1B44E; --warn-soft:#352812; --bad:#FF8F6E; --bad-soft:#3B1E16;
  --unk:#8A96A9; --unk-soft:#212A36;
  --device:#000000; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --map-bg:#1B2330; --map-road:#2E3848; --map-block:#222B38; --map-major:#4A4228;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
bdi{unicode-bidi:isolate}
.wrap{padding-inline:24px;padding-block:28px 80px;max-width:1680px;margin-inline:auto}
@media (max-width:600px){.wrap{padding-inline:16px}}
/* ---------- canvas chrome ---------- */
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block-end:20px;border-bottom:1px solid var(--line)}
@media (max-width:800px){.mast{grid-template-columns:1fr}}
.mast h1{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;margin:0;letter-spacing:0}
.mast h1 small{display:block;font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--ink-2);margin-top:8px;letter-spacing:0}
.mast p{margin:10px 0 0;color:var(--ink-2);max-width:68ch}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.toc a{font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);color:var(--accent-ink);outline:none}
.toc a b{color:var(--accent-ink);font-weight:700;margin-inline-end:4px}
.themes{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--card)}
.themes button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--ink-2);padding:5px 10px;border-radius:7px;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.sec{padding-block:40px 8px;border-bottom:1px solid var(--line)}
.sec-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:baseline;max-width:980px}
.sec-n{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--brand);line-height:1;grid-row:span 2}
.sec-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sec-h p{margin:0;color:var(--ink-2);max-width:78ch}
.sec-h .src{font-size:12px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.core{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-inline-start:8px;vertical-align:3px}
.track{display:flex;gap:28px;overflow-x:auto;padding-block:24px 28px;scroll-snap-type:x proximity;scrollbar-width:thin}
.art{margin:0;flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;width:375px;max-width:calc(100vw - 32px)}
.art figcaption{font-size:13px;color:var(--ink-2);line-height:1.5;min-height:40px}
.art figcaption b{color:var(--ink);font-weight:650;display:block}
.replay{font:inherit;font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:0;border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:4px}
.replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- device ---------- */
.device{width:375px;height:780px;border-radius:44px;background:var(--device);padding:9px;box-shadow:var(--shadow);max-width:100%}
.screen{position:relative;height:100%;border-radius:36px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;
  font-family:var(--f-body);font-size:15px;line-height:1.7;color:var(--ink);direction:rtl;text-align:start;font-feature-settings:"ss01"}
.sbar{height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding-inline:28px;font-size:13px;font-weight:650;direction:ltr}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar i{display:inline-block;background:currentColor;border-radius:1px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.content::-webkit-scrollbar{display:none}
/* ---------- app primitives ---------- */
.pad{padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.wrapr{display:flex;flex-wrap:wrap;gap:6px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .sm{font-size:13px;line-height:1.6} .xs{font-size:12px;line-height:1.5}
.b{font-weight:700} .num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px} .ic.l{width:24px;height:24px}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;background:var(--paper);position:sticky;top:0;z-index:5}
.appbar h3{margin:0;font-size:16px;font-weight:700;line-height:1.4;flex:1;min-width:0}
.appbar .t2{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:none;border:0;flex:0 0 auto}
.iconbtn.soft{background:var(--card);border:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 16px 10px}
.steps div{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:5px;line-height:1.3}
.steps div::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps .done::before{background:var(--accent)} .steps .now{color:var(--accent-ink);font-weight:700}
.steps .now::before{background:linear-gradient(to left,var(--accent) 55%,var(--line) 55%)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.btn{font:inherit;font-weight:650;font-size:15px;min-height:48px;border-radius:14px;border:0;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.pri{background:var(--accent-grad);color:var(--on-accent);box-shadow:0 4px 12px -4px rgba(215,57,72,.45)}
.btn.brand{background:var(--brand);color:var(--on-brand)}
.sbtn{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:0 0 auto;border:0}
.mark{width:30px;height:30px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
.tabs div{flex:1;text-align:center;padding:10px 4px 9px;font-size:13.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs .on{color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--brand)}
.tabs .cnt{font-size:11px;background:var(--sunk);color:var(--ink-2);border-radius:6px;padding:1px 6px}
.btn.sec{background:var(--card);color:var(--accent-ink);border:1px solid var(--line-2)}
.btn.ghost{background:none;color:var(--accent-ink);padding:0 10px;min-height:44px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.chip .x{opacity:.7}
.chip.from{border-style:solid}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:5px 8px;border-radius:7px;white-space:nowrap;font-weight:550}
.sticky-cta{position:absolute;inset-inline:0;bottom:0;padding:12px 16px 26px;background:linear-gradient(to top,var(--paper) 72%,transparent);z-index:8}
.nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 0 22px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);min-height:44px;justify-content:center}
.nav .on{color:var(--accent-ink);font-weight:700}
.h4{font-size:15px;font-weight:750;margin:0;display:flex;align-items:center;gap:8px}
.h4 .n{font-weight:600;color:var(--ink-3);font-size:13px}
.lede{font-size:13px;color:var(--ink-2);margin:2px 0 0;line-height:1.6}
.divider{height:8px;background:var(--sunk);margin-block:6px}
/* ---------- honesty system ---------- */
.price{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.price small{font-size:12px;font-weight:500;color:var(--ink-3);margin-inline-start:3px}
.pb{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.fresh{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);line-height:1.4}
.fresh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.fresh.fresh-fresh::before,.fresh.fresh-recent::before{background:var(--ink-3)}
.fresh.fresh-stale{color:var(--warn)} .fresh.fresh-stale::before{background:var(--warn)}
.fresh.fresh-very_stale{color:var(--bad)} .fresh.fresh-very_stale::before{background:var(--bad)}
.confirmed{display:inline-flex;align-items:center;gap:5px;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:650;line-height:1.5}
.pb.is-confirmed .price{color:var(--ok)}
.unknown{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--unk);color:var(--unk);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--unk-soft);line-height:1.4}
.warnbox{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.55;font-weight:550}
.warnbox.bad{background:var(--bad-soft);color:var(--bad)} .warnbox.warn{background:var(--warn-soft);color:var(--warn)}
.warnbox.info{background:var(--info-soft);color:var(--info-ink)} .warnbox.ok{background:var(--ok-soft);color:var(--ok)}
.warnbox.unk{background:var(--unk-soft);color:var(--ink-2);border:1px dashed var(--unk)}
.oc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:1.4}
.oc::before{content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.oc.open{color:var(--ok)} .oc.open::before{background:var(--ok)}
.oc.closing_soon{color:var(--warn)} .oc.closing_soon::before{background:var(--warn)}
.oc.closed{color:var(--ink-3)} .oc.closed::before{background:var(--ink-3)}
.oc.unknown{color:var(--unk)} .oc.unknown::before{background:none;border:1.5px dashed var(--unk);width:7px;height:7px}
.feat{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;padding:5px 8px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-weight:550}
.feat.yes{color:var(--ink)} .feat.no{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.feat.unk{background:none;border:1px dashed var(--unk);color:var(--unk)}
.inst{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;padding:5px 8px;border-radius:8px;font-weight:600}
.inst.conf{background:var(--ok-soft);color:var(--ok)}
.inst.decl{border:1px solid var(--line-2);color:var(--ink-2);background:var(--card)}
/* ---------- shop card ---------- */
.shop{padding:12px 14px;display:flex;flex-direction:column;gap:9px;position:relative}
.shop.cat{background:transparent;border:1.5px dashed var(--line-2)}
.shop-top{display:flex;gap:10px;align-items:flex-start}
.shop-name{font-weight:750;font-size:15px;line-height:1.45}
.shop-name .unv{font-size:11px;font-weight:500;color:var(--ink-3);margin-inline-start:6px}
.loc{font-size:12.5px;color:var(--ink-2);line-height:1.5;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.loc .sep{color:var(--ink-3)}
.sel{width:26px;height:26px;border-radius:8px;border:1.8px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;margin-top:1px;background:var(--card)}
.sel.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.why{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start;line-height:1.55}
.why b{color:var(--info-ink);font-weight:700;flex:0 0 auto}
.shop-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.shop.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- product ---------- */
.thumb{width:76px;height:76px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,var(--card),var(--sunk));border:1px solid var(--line);color:var(--accent)}
.thumb .ic{width:38px;height:38px;stroke-width:1.4}
.thumb .br{position:absolute;bottom:4px;inset-inline-end:6px;font-size:10px;color:var(--ink-3);font-weight:600}
.thumb.none{background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,var(--card) 6px 12px);color:var(--ink-3)}
.pcard{display:flex;gap:12px;padding:12px}
.ptitle{font-weight:700;font-size:14.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.range{font-size:12.5px;color:var(--ink-2)}
/* ---------- skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,14,30,.42);z-index:20}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;z-index:21;padding:8px 16px 26px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;scrollbar-width:none}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;flex:0 0 auto}
.sheet h3{margin:0;font-size:17px;font-weight:750}
.field{display:flex;align-items:center;gap:8px;min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 12px;font-size:15px}
.field.big{align-items:flex-start;min-height:96px;padding:12px 14px;font-size:16px;line-height:1.7}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line-2);position:relative;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)} .toggle.on::after{inset-inline-start:21px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg div{min-height:38px;display:grid;place-items:center;font-size:13px;border-radius:9px;color:var(--ink-2);font-weight:550;text-align:center;line-height:1.3;padding-inline:4px}
.seg .on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.slider{position:relative;height:28px;margin-inline:6px}
.slider .rail{position:absolute;inset-inline:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.slider .fill{position:absolute;top:12px;height:4px;border-radius:2px;background:var(--accent)}
.slider .knob{position:absolute;top:2px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--accent);transform:translateX(50%)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;font-size:13px;line-height:1.6}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info-ink)} .banner.unk{background:var(--unk-soft);color:var(--ink-2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 24px}
.empty .art-i{width:96px;height:96px;border-radius:28px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .art-i .ic{width:44px;height:44px;stroke-width:1.5}
.empty h4{margin:0;font-size:17px;font-weight:750;text-wrap:balance}
.empty p{margin:0;font-size:14px;color:var(--ink-2);max-width:30ch}
.toast{position:absolute;bottom:112px;inset-inline:12px;z-index:30;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}
.toast .ic{color:var(--warn)}
/* ---------- tracker ---------- */
.tl{display:flex;align-items:center;gap:0;margin-top:2px}
.tl span{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.tl span::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);flex:0 0 auto}
.tl span.done{color:var(--ink-2)} .tl span.done::before{background:var(--accent);border-color:var(--accent)}
.tl span.live::before{border-color:var(--accent);animation:pulse 1.3s ease infinite}
.tl i{flex:1;height:1.5px;background:var(--line);margin-inline:5px;min-width:10px}
.tl i.done{background:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.qa{background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.6}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st.sent,.st.delivered{background:var(--info-soft);color:var(--info-ink)}
.st.answered{background:var(--ok-soft);color:var(--ok)} .st.unavailable{background:var(--bad-soft);color:var(--bad)}
.st.no_reply{background:var(--unk-soft);color:var(--ink-2);border:1px dashed var(--unk)}
.diff{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px}
.strike{text-decoration:line-through;color:var(--ink-3);font-size:12.5px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.sum b{display:block;font-size:18px;color:var(--ink);font-weight:800}
/* ---------- map ---------- */
.map{position:relative;height:250px;background:var(--map-bg);overflow:hidden}
.map svg{display:block;width:100%;height:100%}
.pin-lbl{font:700 11px var(--f-body)}
.mapctl{position:absolute;inset-inline-start:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.maplegend{position:absolute;inset-inline-end:10px;top:10px;background:var(--card);border-radius:10px;padding:6px 9px;font-size:11px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);line-height:1.4}
.lg{display:flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.lg i.c{background:none;border:1.5px dashed var(--ink-3)}
.lg i.u{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

.mloc{display:flex;gap:12px;align-items:stretch;padding:12px}
.floors{display:flex;flex-direction:column-reverse;gap:2px;width:54px;flex:0 0 auto}
.floors div{height:11px;border-radius:3px;background:var(--sunk);font-size:8px;line-height:11px;text-align:center;color:var(--ink-3)}
.floors .hit{background:var(--accent);color:var(--on-accent);font-weight:700;height:15px;line-height:15px}
.floors .unk{background:none;border:1px dashed var(--unk)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-weight:700;font-size:14px;line-height:1.5}
.crumb .ar{color:var(--ink-3);font-weight:400}
.crumb .u{color:var(--unk);border:1px dashed var(--unk);border-radius:6px;padding:0 6px;font-weight:600;font-size:12.5px}

.hours{width:100%;border-collapse:collapse;font-size:13.5px}
.hours td{padding:7px 10px;border-bottom:1px solid var(--line)}
.hours tr.today td{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.hours tr.fri td{color:var(--ink-3)}
.hours td:last-child{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.hours .bad{color:var(--bad);font-weight:650}
.ctab{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.ctab th,.ctab td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start;line-height:1.55}
.ctab th{font-weight:600;color:var(--ink-2);font-size:12px;width:30%}
.ctab tr.d td{background:var(--warn-soft)}
.ctab tr.d th{box-shadow:inset -3px 0 0 var(--warn)}
.cell-unk{color:var(--unk);border:1px dashed var(--unk);border-radius:6px;padding:1px 6px;font-size:12px;display:inline-block}
/* ---------- chat ---------- */
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.75}
.msg.me{align-self:flex-start;background:var(--accent);color:var(--on-accent);border-end-start-radius:6px}
.msg.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:6px}
.toolline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);align-self:flex-end}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.mini{width:150px;flex:0 0 auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.mini .thumb{width:100%;height:78px}
/* ---------- seller side ---------- */
.seller .appbar{background:var(--ink);color:var(--paper)}
.bigbtn{min-height:64px;border-radius:16px;font:inherit;font-size:18px;font-weight:750;border:0;display:flex;align-items:center;justify-content:center;gap:10px}
.bigbtn.ok{background:var(--ok);color:var(--card)} .bigbtn.no{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
/* ---------- component board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-block:22px 28px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.spec h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.spec .rtl{direction:rtl;font-size:15px;display:flex;flex-direction:column;gap:12px}
.spec .lbl{direction:ltr;font-size:11.5px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left}
.spec .item{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.spec .item:last-child{border-bottom:0;padding-bottom:0}
.micro{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-block:22px 28px}
.micro .m{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;direction:rtl;display:flex;flex-direction:column}
.micro .m .lbl{direction:ltr;font-size:11.5px;color:var(--ink-3);padding:8px 12px;border-top:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:auto}
.note{font-size:12.5px;color:var(--ink-3);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function mallLocator(s, floorsRange=[-2,7]) {

function mapSvg(listed, cat, {sel=[], h=250}={}) {
  const o = D.shops.origin, k = Math.cos(o[0]*Math.PI/180)*111320, W=357, H=h, sc=0.95, cx=-115, cy=-20;
  const xy = (lat, lon) => [W/2 - ((lon-o[1])*k - cx)*sc, H/2 - ((lat-o[0])*110540 - cy)*sc];
  // RTL mirror is wrong for maps: keep geography — east is right
  const g = (lat,lon) => { const [x,y] = xy(lat,lon); return [W - x, y]; };
  const [ux,uy] = g(o[0],o[1]);
  const roads = `
   <rect width="${W}" height="${H}" fill="var(--map-bg)"/>
   ${[[20,20,90,60],[130,15,70,50],[225,25,110,55],[18,140,95,80],[128,150,80,70],[230,150,110,80]].map(([x,y,w,hh])=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="6" fill="var(--map-block)"/>`).join('')}
   <path d="M-10 ${uy+8} L${W+10} ${uy-4}" stroke="var(--map-major)" stroke-width="16"/>
   <path d="M${ux-14} -10 L${ux-4} ${H+10}" stroke="var(--map-road)" stroke-width="12"/>
   <path d="M60 -10 L72 ${H+10}" stroke="var(--map-road)" stroke-width="7"/>
   <path d="M-10 70 L${W+10} 64" stroke="var(--map-road)" stroke-width="6"/>
   <path d="M-10 ${H-30} L${W+10} ${H-38}" stroke="var(--map-road)" stroke-width="6"/>
   <text x="${W-12}" y="${uy-10}" text-anchor="end" class="pin-lbl" fill="var(--ink-3)" style="font-weight:600">خیابان جمهوری</text>
   <text x="${ux+4}" y="${H-12}" class="pin-lbl" fill="var(--ink-3)" style="font-weight:600" transform="rotate(-86 ${ux+4} ${H-12})">خیابان حافظ</text>
   <rect x="${g(35.6949,51.4114)[0]-34}" y="${g(35.6949,51.4114)[1]-26}" width="70" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1"/>
   <text x="${g(35.6949,51.4114)[0]}" y="${g(35.6949,51.4114)[1]+42}" text-anchor="middle" class="pin-lbl" fill="var(--accent-ink)">پاساژ علاالدین</text>`;
  const cats = cat.map(s => { const [x,y] = g(s.lat,s.lon); return `<circle cx="${x}" cy="${y}" r="6" fill="var(--card)" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="2.5 2"/>`; }).join('');
  // cluster listed pins inside the mall into a stacked badge
  const pins = listed.slice(0,4).map((s,i) => { const [x,y] = g(s.lat,s.lon); const on = sel.includes(s.shop_id);
    const lx = x + (i%2? 22:-22), ly = y + (i<2?-14:14);
    return `<g><circle cx="${x}" cy="${y}" r="5" fill="${on?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2"/></g>`; }).join('');
  const label = (() => { const [x,y] = g(35.6949,51.4114); return `<g><rect x="${x-78}" y="${y-58}" width="156" height="26" rx="13" fill="var(--accent)"/><text x="${x}" y="${y-41}" text-anchor="middle" class="pin-lbl" fill="var(--on-accent)">${fa(listed.length)} فروشگاه · از ${mil(Math.min(...listed.map(s=>s.offer?.price||1e12)))}</text><path d="M${x-5} ${y-33} L${x} ${y-27} L${x+5} ${y-33}" fill="var(--accent)"/></g>`; })();
  const user = `<circle cx="${ux}" cy="${uy}" r="14" fill="var(--ok)" opacity=".18"/><circle cx="${ux}" cy="${uy}" r="6.5" fill="var(--ok)" stroke="var(--card)" stroke-width="2.5"/>`;
  return `<div class="map" style="height:${h}px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نقشهٔ فروشگاه‌ها اطراف چهارراه حافظ و جمهوری">${roads}${cats}${pins}${label}${user}</svg>
   <div class="maplegend"><span class="lg"><i></i>کالا را ثبت کرده</span><span class="lg"><i class="c"></i>فقط در این دسته</span><span class="lg"><i class="u"></i>شما</span></div>
   <div class="mapctl"><button class="iconbtn soft" aria-label="موقعیت من">${ic('loc')}</button></div></div>`;
}

{

  const hours = (wh, sus=false) => !wh ? `<div class="warnbox unk">${ic('clock','s')}<span><b>ساعت کاری ثبت نشده.</b> قبل از رفتن بپرسید؛ در استعلام سؤال ساعت را اضافه کرده‌ایم.</span></div>` :
    `<table class="hours"><tbody>${DAYS.map(([k,l])=>{ const d = wh[k]; const sh = (d.shifts||[]).filter(x=>!(x.start_time==='00:00:00'&&x.end_time==='00:00:00'));
      let v; if (d.status==='closed') v='تعطیل'; else if (d.status==='unsupported') v='<span class="bad">نامعتبر</span>'; else v = sh.map(x=>`${hm(x.start_time)}–${hm(x.end_time)}`).join('، ');
      const odd = sus && d.status==='declared' && sh.some(x=>x.start_time<'06:00:00');
      return `<tr class="${k==='wed'?'today':''} ${k==='fri'?'fri':''}"><td>${l}${k==='wed'?' · امروز':''}</td><td>${odd?`<span class="bad">${v} ⚠</span>`:v}</td></tr>`; }).join('')}</tbody></table>`;
  const head = (s) => `<div class="stack" style="gap:6px">${shopName(s)}${!s.name_is_verified?'<span class="xs faint">نام از داده‌ها نمایش داده می‌شود؛ ممکن است با تابلوی فروشگاه فرق کند.</span>':''}<div class="wrapr">${openChip(s.open)}</div><div class="wrapr">${instChips(s,true)}${fast(s.fast_delivery)}</div></div>`;

  const offers = s => s.offers.length ? `<div class="stack" style="gap:8px"><div class="h4">کالاهای ثبت‌شده <span class="n">${fa(s.offer_count)}</span></div>${s.offers.slice(0,2).map(o=>`<div class="card" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px"><div class="sm b" style="line-height:1.6">${bidi(o.title||o.seller_title)}</div>${priceBadge(o)}</div>`).join('')}</div>`

  const cta = `<div class="sticky-cta"><button class="btn pri block">${ic('send','s')}استعلام از این فروشگاه</button></div>`;
  const page = (s, extra, srcTxt) => appbar('فروشگاه','',{end:`<button class="iconbtn" aria-label="نقشه">${ic('map')}</button>`}) + `<div class="pad stack" style="gap:14px;padding-bottom:110px">${head(s)}${mallLocator(s, s.floor!=null && s.floor>6?[-2,s.floor]:[-2,7])}${extra}${offers(s)}${cats(s)}${noCall}${srcNote(srcTxt)}</div>`;

  out.push(section('7','shop','Shop detail','Everything about one shop. Weekly hours with today highlighted; Friday visibly closed; suspicious hours flagged; missing data drawn as missing. No call button.','shop_full_hours_in_mall · shop_suspicious_hours · shop_real_name_with_website · shop_installment_channel_unknown · shop_installment_in_person',[

    phone({cap:'C · Verified name, website, no hours', sub:'A real brand (name_is_verified) earns the green badge and a website link. Hours: none on record.', body: page(c, `<a href="${esc(c.website)}" target="_blank" rel="noopener" class="card row" style="padding:12px 14px;gap:10px;color:var(--accent-ink);text-decoration:none">${ic('link','s')}<bdi>takhtjamshidmobile.com</bdi></a><div class="stack" style="gap:6px"><div class="h4">ساعت کاری</div>${hours(null)}</div>`, 'منبع: ترب · نام فروشگاه تأییدشده')}),
    phone({cap:'D · Closed now, installment unconfirmed', sub:'Closed state says when it reopens. Two providers declared, but in-store acceptance is unknown, and the chips say that.', body: page(d, `<div class="stack" style="gap:6px"><div class="h4">ساعت کاری</div>${hours(d.weekly_hours)}</div>`, 'منبع: ترب · قسط اعلام‌شده توسط فروشگاه'), cta}),
    phone({cap:'E · Street shop, in-person installment', sub:'No mall: the locator shows the street address instead. Digipay confirmed in store gets the solid green chip. Open Friday afternoon.', body: page(e, `<div class="stack" style="gap:6px"><div class="h4">ساعت کاری</div>${hours(e.weekly_hours)}</div>`, 'منبع: ترب · پذیرش حضوری تأییدشده'), cta}),

   ${m('empty search', e('search','چیزی پیدا نکردیم','کلمهٔ کوتاه‌تری بنویسید یا بودجه را بردارید.','<button class="btn sec">پاک کردن فیلترها</button>'))}
   ${m('no shops near you', e('pin','نزدیک شما فروشگاهی این کالا را ثبت نکرده','نزدیک‌ترین فروشگاه ۳٫۴ کیلومتر دورتر است.','<button class="btn sec">شعاع را ۵ کیلومتر کن</button>'))}
   ${m('all shops closed now', e('clock','همهٔ فروشگاه‌ها الان بسته‌اند','بیشترشان فردا ساعت ۱۰:۰۰ باز می‌شوند. استعلام را حالا بفرستید تا صبح جواب بگیرید.','<button class="btn sec">استعلام برای فردا</button>','style="background:var(--unk-soft);color:var(--ink-3)"'))}
   ${m('Friday', `<div style="padding:16px">${`<div class="warnbox unk">${ic('clock','s')}<span><b>جمعه است.</b> بیشتر پاساژهای جمهوری و لاله‌زار جمعه‌ها تعطیل‌اند؛ فقط فروشگاه‌هایی که ساعت جمعه ثبت کرده‌اند نشان داده می‌شوند.</span></div>`}</div>`)}
   ${m('price very old', `<div style="padding:16px" class="stack">${priceBadge(D.edge.stale_over_90_days.offer)}<div class="warnbox bad">${ic('alert','s')}<span>این قیمت ۲۸۳ روز پیش ثبت شده و احتمالاً عوض شده است. قبل از رفتن بپرسید.</span></div></div>`)}
   ${m('suspicious price', `<div style="padding:16px">${priceBadge(D.edge.suspicious_price.offer)}</div>`)}
   ${m('seller silent (timeout)', `<div style="padding:16px">${inqCard(NOREPLY)}</div>`)}
   ${m('out of stock → alternatives', `<div style="padding:16px">${inqCard(INQ[3])}</div>`)}
   ${m('location permission ask', e('loc','فروشگاه‌های نزدیک شما را پیدا کنیم؟','موقعیت فقط برای حساب فاصله و زمان پیاده‌روی استفاده می‌شود و جایی ذخیره نمی‌شود.','<div class="row" style="gap:8px"><button class="btn sec">انتخاب دستی</button><button class="btn pri">اجازه می‌دهم</button></div>'))}

   ${m('generic error', e('alert','مشکلی پیش آمد','نتوانستیم فروشگاه‌ها را بارگذاری کنیم. اتصال را بررسی کنید و دوباره امتحان کنید.','<button class="btn sec">'+ic('refresh','s')+'تلاش دوباره</button>','style="background:var(--bad-soft);color:var(--bad)"'))}

}

document.getElementById('app').innerHTML = out.join('');

/* ---------- interactions ---------- */
const root = document.documentElement;
const tb = [...document.querySelectorAll('.themes button')];
const setT = t => { if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); tb.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.t===t))); try{localStorage.setItem('hk-theme', t)}catch(e){} };
let saved=''; try{ saved = localStorage.getItem('hk-theme') || '' }catch(e){}
setT(saved); tb.forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));

// Live installment filter on Shops A: re-rank in place, no reload
let instOn = false;
function renderShops() {
  const list = document.querySelector('#shopsA #shopsList'); if (!list) return;
  const data = instOn ? D.shopsInst : D.shops;
  const head = `<div class="pad" style="padding-top:4px"><div class="h4">${ic('store','s')}این کالا را ثبت کرده‌اند <span class="n">${fa(data.listed.length)} از ${fa(data.counts.listed)}</span></div><p class="lede">${instOn?'فقط فروشگاه‌هایی که قسط اعلام کرده‌اند.':'قیمت ثبت‌شده توسط خود فروشگاه؛ تاریخ هر قیمت کنارش است.'}</p></div>`;
  list.innerHTML = head + `<div class="pad stack" style="gap:10px;padding-bottom:110px">${data.listed.slice(0,6).map((s,i)=>shopCard(s,{sel:i<3})).join('').replace(/class="card shop /g,'class="card shop flash ')}</div>`;
  const chip = document.querySelector('#shopsA [data-toggle="inst"]');
  chip.classList.toggle('on', instOn); chip.innerHTML = (instOn?ic('check','s'):ic('card','s')) + 'قسطی';
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-toggle="inst"], [data-act]'); if (!t) return;
  if (t.matches('[data-toggle="inst"]') && t.closest('#shopsA')) { instOn = !instOn; renderShops(); }
  if (t.dataset.act === 'inst') { instOn = !instOn; renderShops(); }
  if (t.dataset.act === 'replay') replay();
});
// Replay the tracker: statuses arrive one by one
let timers = [];
function replay() {
  timers.forEach(clearTimeout); timers = [];
  const scr = document.getElementById('trk'); if (!scr) return;
  const toast = scr.querySelector('#trkToast'); toast.hidden = true;
  let cur = inqAll.map(q=>({...q, status:'sent', label:'ارسال شد'}));
  const paint = (id) => { scr.querySelector('.tlist').innerHTML = cur.map(q=>inqCard(q,{flash:q.id===id})).join(''); scr.querySelector('.tsum').innerHTML = summary(cur); };
  paint();
  const seq = [['inq_demo1','delivered'],['inq_demo0','delivered'],['inq_demo3','delivered'],['inq_demo2','delivered'],['inq_demo3','final'],['inq_demo2','final'],['inq_demo1','delivered'],['inq_demo4','final']];
  seq.forEach(([id,what],i) => timers.push(setTimeout(() => {
    cur = cur.map(q => q.id!==id ? q : what==='final' ? inqAll.find(x=>x.id===id) : {...q, status:'delivered', label:'دیده شد'});
    paint(id);
    if (id==='inq_demo2' && what==='final') toast.hidden = false;
  }, 900*(i+1))));
}
</script>
